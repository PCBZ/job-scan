# Copy to ~/.job-scan/config.toml and edit. That file holds your real
# preferences and never belongs in this repo.
#
#   cp config.example.toml ~/.job-scan/config.toml
#
# Anything marked TODO drives hard filtering. Get these right, or the scan will
# confidently recommend roles you can't actually take.

# ---------------------------------------------------------------------------
# Mailboxes. Add one [[account]] block per inbox — job alerts to a personal
# Gmail, recruiter mail to a school address, and so on. All of them are scanned
# in one run and merged into a single report.
#
# Credentials are NOT stored here. Each account names the .env keys to read, so
# this file stays safe to share and only .env needs chmod 600. If you omit
# user_env / password_env they default to <NAME>_USER and <NAME>_PASSWORD,
# uppercased — the "personal" account below would read PERSONAL_USER and
# PERSONAL_PASSWORD.
#
# Account names key the dedupe state, so keep them stable and unique. Renaming
# one makes its history look unseen and you will get a day of repeats.
# ---------------------------------------------------------------------------
[[account]]
name = "personal"
host = "imap.gmail.com"
port = 993
folder = "INBOX"            # a Gmail label also works, e.g. "Job Alerts"
user_env = "GMAIL_USER"
password_env = "GMAIL_PASSWORD"

# A second mailbox — delete this block if you only have one.
[[account]]
name = "school"
host = "outlook.office365.com"
port = 993
folder = "INBOX"
user_env = "SCHOOL_USER"
password_env = "SCHOOL_PASSWORD"
# Any [mail] key can be overridden per account. A university inbox carries
# career-services digests that the shared allowlist would drop:
senders = ["linkedin.com", "handshake", "joinhandshake.com", "careers", "edu"]

# ---------------------------------------------------------------------------
# Resume library — a directory (usually its own git repo) of resume variants.
# LaTeX sources are flattened to text automatically; PDF/Markdown also work.
# Each variant is a separate file, and the scan can tell you which one to send
# for a given posting.
# ---------------------------------------------------------------------------
[resume]
lib = "~/Developer/my-resume"      # TODO — path to your resume repo
variants = ["*.tex", "src/*.tex"]  # globs, relative to lib
default = "resume"                 # variant name (filename without extension)

[mail]
# Shared defaults for every account. Any key here can be overridden inside an
# individual [[account]] block.
#
# Who counts as a job-alert sender. Matched as a substring of the From header,
# so a bare domain covers every subaddress. Mail from these senders skips the
# subject-keyword check below.
senders = [
  "linkedin.com",
  "indeed.com",
  "joinhandshake.com",
  "glassdoor.com",
  "ziprecruiter.com",
  "dice.com",
  "wellfound.com",
  "builtin.com",
  "otta.com",
]

# Catches recruiters mailing you directly from an unlisted address.
subject_keywords = [
  "hiring", "opportunity", "job", "role", "position",
  "opening", "recruit", "interview", "we're looking for",
  "招聘", "内推",
]

exclude_senders = ["noreply@github.com", "notifications@slack.com"]

max_messages = 60           # per run, newest first
max_chars_per_message = 6000

# ---------------------------------------------------------------------------
# Your profile. Drives the hard gates during matching.
# ---------------------------------------------------------------------------
[profile]
target_titles = ["Software Engineer", "Backend Engineer"]  # TODO
seniority = "TODO"          # new-grad | junior | mid | senior | staff
years_experience = "TODO"
locations = ["Boston, MA", "Remote (US)"]                  # TODO
open_to_remote = true
open_to_relocation = false

# true if you need H-1B/OPT sponsorship — this one flag filters out most
# defense and government roles.
needs_sponsorship = "TODO"

min_salary_usd = 0          # annual base; 0 disables the gate

# Weighted at 35% of the score. List what you can defend in an interview,
# not everything you have touched.
core_skills = []            # TODO — e.g. ["Python", "Go", "PostgreSQL", "AWS"]

exclude_keywords = ["unpaid", "commission only", "MLM"]

[report]
max_top_picks = 5
min_score_to_recommend = 60
repeat_suppression_days = 30
suggest_variant = true      # name the best-fitting resume variant per posting
