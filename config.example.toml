# Copy to ~/.job-scan/config.toml and edit. That file holds your real
# preferences and never belongs in this repo.
#
#   cp config.example.toml ~/.job-scan/config.toml
#
# Anything marked TODO drives hard filtering. Get these right, or the scan will
# confidently recommend roles you can't actually take.

# ---------------------------------------------------------------------------
# Mailboxes. Add one [[account]] block per inbox — job alerts to a personal
# Gmail, recruiter mail to a school address, and so on. All of them are scanned
# in one run and merged into a single report.
#
# Credentials are NOT stored here. Each account names the .env keys to read, so
# this file stays safe to share and only .env needs chmod 600. If you omit
# user_env / password_env they default to <NAME>_USER and <NAME>_PASSWORD,
# uppercased with punctuation replaced by _ — "gmail-alt" below reads
# GMAIL_ALT_USER and GMAIL_ALT_PASSWORD.
#
# Ask the tool which keys your config needs rather than copying this file:
#   fetch_mail.py --env-template
#
# Account names key the dedupe state, so keep them stable and unique. Renaming
# one makes its history look unseen and you will get a day of repeats.
# ---------------------------------------------------------------------------
# `provider` fills in host and port: gmail, m365, outlook, icloud, yahoo,
# fastmail. Set `host` directly for anything else. With several mailboxes this
# is worth using — one typo in a repeated hostname is a confusing failure.
[[account]]
name = "gmail-main"
provider = "gmail"
folder = "INBOX"            # a Gmail label also works, e.g. "Job Alerts"

# Every Gmail account needs its OWN App Password — they are per-account, not
# per-device. Env keys default to <NAME>_USER / <NAME>_PASSWORD, so this one
# reads GMAIL_ALT_USER and GMAIL_ALT_PASSWORD.
[[account]]
name = "gmail-alt"
provider = "gmail"

# Microsoft 365 / Outlook. Read the note below before assuming this connects.
# `provider` also accepts "m365" for a work or university tenant.
[[account]]
name = "outlook-personal"
provider = "outlook"
# Any [mail] key can be overridden per account, which is how one mailbox gets a
# different allowlist — a university inbox, say, that carries career-services
# digests the shared list would drop:
senders = ["linkedin.com", "joinhandshake.com", "careers"]

# Microsoft disabled basic auth for Exchange Online, and most school and work
# tenants never re-enabled it. If a 365 account fails with AUTHENTICATIONFAILED
# no matter which password you try, the tenant is the reason and no app
# password will fix it — forward that mailbox to a Gmail account above and
# scan that instead. `--check` reports each account separately so you can tell
# which ones actually work.
#
# Account names key the dedupe state AND derive the default env var names, so
# they must stay unique after uppercasing and replacing punctuation:
# "gmail-alt" and "gmail.alt" would collide. The loader refuses to start on a
# collision rather than let two accounts read one mailbox's credentials.

# ---------------------------------------------------------------------------
# Resume library — a directory (usually its own git repo) of resume variants.
# LaTeX sources are flattened to text automatically; PDF/Markdown also work.
# Each variant is a separate file, and the scan can tell you which one to send
# for a given posting.
# ---------------------------------------------------------------------------
[resume]
lib = "~/Developer/my-resume"      # TODO — path to your resume repo
repo = "you/my-resume"             # TODO — the same repo on GitHub, read by the cloud run
ref = "main"                       # branch, tag or commit the cloud run reads
# A relative value resolves against this workspace directory, not the
# current working directory, so a scheduled run finds the same library.
variants = ["*.tex", "src/*.tex"]  # globs, relative to lib
default = "resume"                 # variant name (filename without extension)

[mail]
# Shared defaults for every account. Any key here can be overridden inside an
# individual [[account]] block.
#
# Who counts as a job-alert sender. Matched as a substring of the From header,
# so a bare domain covers every subaddress. Mail from these senders skips the
# subject-keyword check below.
senders = [
  "linkedin.com",
  "indeed.com",
  "joinhandshake.com",
  "glassdoor.com",
  "ziprecruiter.com",
  "dice.com",
  "wellfound.com",
  "otta.com",
]

# Catches recruiters mailing you directly from an unlisted address.
subject_keywords = [
  "hiring", "opportunity", "job", "role", "position",
  "opening", "recruit", "interview", "we're looking for",
  "招聘", "内推",
]

exclude_senders = ["noreply@github.com", "notifications@slack.com"]

# How far back each run looks. Overlap is harmless — Message-ID dedupe drops
# anything already seen.
days = 7

max_messages = 60           # PER ACCOUNT, newest first
max_chars_per_message = 6000

# Whole-run ceiling across every account. max_messages is per mailbox, so
# without this the volume handed to the model grows linearly with the number of
# accounts — four mailboxes at the caps above is roughly 360k tokens of email,
# which will not fit. Newest mail wins; anything dropped is reported in
# stats.dropped_by_account and is NOT marked as seen, so it can still arrive
# tomorrow. If it drops every day, narrow `senders` or lower `--days`.
max_total_messages = 150

# ---------------------------------------------------------------------------
# Your profile. Drives the hard gates during matching.
# ---------------------------------------------------------------------------
[profile]
# Every gate here accepts a sentinel that switches it OFF: seniority = "all",
# years_experience / needs_sponsorship = "unknown", min_salary_usd = 0, or an
# empty core_skills. A disabled gate is treated as a deliberate choice, not as
# missing config — the posting is kept and the requirement is reported instead,
# so you can see the full field and narrow later from real output.
target_titles = ["Software Engineer", "Backend Engineer"]  # TODO
seniority = "all"           # all | new-grad | junior | mid | senior | staff
years_experience = "unknown"
# TODO — the places you will actually work, not a region. This gate has no
# "off" sentinel: "Boston, MA" does not admit New York, and a nearby suburb is
# only in scope if you list it.
locations = ["Boston, MA", "Cambridge", "Remote (US)"]
open_to_remote = true
open_to_relocation = false

# true if you need H-1B/OPT sponsorship — that one flag filters out most defense
# and government roles. "unknown" keeps everything and flags postings that state
# a requirement.
#
# This is framed around US sponsorship. If `locations` names Canadian, UK or EU
# cities the relevant test is different (work permit / PR / visa sponsorship
# under that country's rules), so leave it "unknown" rather than answering the
# wrong question.
needs_sponsorship = "unknown"

# Annual base; 0 disables the gate. The name says usd — if your postings are
# quoted in another currency a numeric floor here compares across units.
min_salary_usd = 0

# The cloud run's salary floor, in salary_currency (CAD or USD); it supersedes
# min_salary_usd when set. A posting's currency comes from its salary text
# (CA$, USD) or, for a bare "$", from its location's country, and is converted
# at the Bank of Canada's daily rate. Unknown currencies are never filtered.
# min_salary = 0
# salary_currency = "CAD"

# Weighted at 35% of the score. List what you can defend in an interview, not
# everything you have touched. Empty means "infer from the resume".
core_skills = []

exclude_keywords = ["unpaid", "commission only", "MLM"]

[report]
max_top_picks = 5
min_score_to_recommend = 60
repeat_suppression_days = 30
suggest_variant = true      # name the best-fitting resume variant per posting

# The cloud run emails the full report (the local skill ignores these). It is
# sent through Gmail SMTP from the [[account]] named here, reusing that
# account's app password, to email_to (default: that account's own address).
# The recipient only ever comes from here, never from mail content.
# email_account = "personal"
# email_to = "me@example.com"

# The cloud run also sends a short Telegram summary with Approve / Skip buttons
# to this chat. The bot token stays out of this file (Key Vault in Azure,
# TELEGRAM_BOT_TOKEN locally). Find the id with `npm run telegram:chat-id`
# after messaging the bot once.
# telegram_chat_id = 123456789
