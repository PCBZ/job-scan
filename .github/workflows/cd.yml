# The deploy identity trusts this workflow by name: keep `name` in step with
# infra/bootstrap's github_workflow.
name: CD

# A release is a v* tag on main: git tag vX.Y.Z && git push origin vX.Y.Z.
# It applies infra/ as committed, deploys the tag's build as the app's code,
# smoke-tests the deployed evaluation report (#134), then publishes the build
# to GitHub Packages (#143).
#
# Run by hand ("Run workflow", on a tag), it runs the smoke test alone: the
# deploy identity trusts this workflow on tags, so a branch run gets no token.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One apply at a time, and never cancel one half-way.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  build:
    name: Check and package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Azure only checks that this is a tag of this workflow; that the tag is
      # on main is checked here.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        working-directory: .
        run: functions/node_modules/.bin/biome check .

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # What the app reads at runtime: the compiled code, its prompts and
      # report template, and production dependencies only.
      - name: Package
        run: |
          npm prune --omit=dev
          zip -qr ../app.zip dist prompts templates host.json package.json node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
          retention-days: 7

  deploy:
    name: Apply and deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      # The azurerm provider and backend sign in with the job's OIDC token.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # What infra/bootstrap built: the resource group, the vault, the app's
      # identity. Identifiers only.
      TF_VAR_platform: ${{ vars.TF_VAR_platform }}
      # The tag, written into each run record (#97).
      TF_VAR_app_version: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
          terraform_wrapper: false

      - name: Init
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.TFSTATE_KEY }}"
          -backend-config="use_azuread_auth=true"

      - name: Apply
        run: terraform apply -auto-approve

      - name: Function App name
        id: app
        run: echo "name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

      # The code goes out through OneDeploy, the only way Flex Consumption takes
      # it: azurerm's zip_deploy_file can't (hashicorp/terraform-provider-azurerm#29630).
      # Same CD identity and OIDC trust as Terraform; Contributor covers it.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # https://github.com/Azure/functions-action
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ${{ runner.temp }}/app.zip

  # The deployed evalReport, end to end in Azure: the queue trigger as the
  # app's identity, Blob, Log Analytics and Gmail (#134). It reports on the
  # latest run with a [SMOKE] subject; whether the email arrives is checked by
  # hand. The script touches queue data only, so no record reaches these logs.
  smoke:
    name: Smoke-test the evaluation report
    needs: deploy
    if: >-
      !cancelled() && (needs.deploy.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Run on a tag
        if: github.ref_type != 'tag'
        run: |
          echo "Run this workflow on a tag: the deploy identity trusts tag runs only."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        working-directory: functions
        run: npm ci --omit=dev

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
          terraform_wrapper: false

      - name: Storage account
        id: storage
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TFSTATE_KEY }}" \
            -backend-config="use_azuread_auth=true" >/dev/null
          echo "name=$(terraform output -raw storage_account_name)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Smoke test
        working-directory: functions
        run: node scripts/smoke-eval.mjs "${{ steps.storage.outputs.name }}"

  # Only a build that is deployed and smoke-tested becomes a package version.
  package:
    name: Publish to GitHub Packages
    needs: smoke
    if: github.event_name == 'push' && needs.smoke.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
