# Publish a release's app build to GitHub Packages, as @pcbz/job-scan on the
# npm registry (#143): one version per tag, so every deployed build is kept.
#
# CD calls this after the smoke test passes. By hand: Actions → Publish
# package → Run workflow, with a tag to publish one already released, or blank
# for the latest release tag.
name: Publish package

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, such as v0.1.10
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.10; blank for the latest
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: publish-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag || 'the latest tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Release tag
        id: tag
        working-directory: .
        env:
          INPUT: ${{ inputs.tag }}
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          tag="$INPUT"
          if [ -z "$tag" ]; then
            tag=$(git ls-remote --tags --refs --sort=-v:refname "$REPO" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: '$tag'"; exit 1; }
          echo "Publishing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Tag is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@pcbz"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The package fields are set here, not committed, so a tag made before
      # this workflow publishes too. Its contents are what CD deploys, less
      # node_modules: the code, prompts, report template and host.json.
      - name: Package fields
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            delete pkg.private;
            Object.assign(pkg, {
              name: "@pcbz/job-scan",
              version: process.env.TAG.slice(1),
              files: ["dist", "prompts", "templates", "host.json"],
              publishConfig: { registry: "https://npm.pkg.github.com" },
              repository: { type: "git", url: "git+https://github.com/PCBZ/job-scan.git", directory: "functions" },
            });
            writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
